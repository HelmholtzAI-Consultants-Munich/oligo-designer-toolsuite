[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oligo_designer_toolsuite"]

[tool.setuptools_scm]
write_to = "oligo_designer_toolsuite/_version.py"
local_scheme = "no-local-version"

[project]
name = "oligo-designer-toolsuite"
dynamic = ["version"]
description = "Oligo Designer Toolsuite: lightweight development of custom oligo design pipelines"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Lisa Barros de Andrade e Sousa", email = "lisa.barros.andrade.sousa@gmail.com" },
  { name = "Isra Mekki" },
  { name = "Francesco Campi" },
  { name = "Chelsea Bright" },
  { name = "Louis Kümmerle" },
  { name = "Jonas Hagenberg" },
]
maintainers = [
  { name = "Lisa Barros de Andrade e Sousa", email = "lisa.barros.andrade.sousa@gmail.com" },
  { name = "Jonas Hagenberg", email = "jonas.hagenberg@helmholtz-muenchen.de" },
]
keywords = [
  "oligo design",
  "high throughput genomics",
  "spatial transcriptomics",
  "bioinformatics",
  "reproducible research",
  "workflow automation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "biopython>=1.86,<2",
  "cyvcf2>=0.32,<1",
  "effidict>=0.0.10,<1",
  "ipywidgets>=8.1,<9",
  "joblib>=1.4,<2",
  "joblib_progress>=1.0,<2",
  "networkx>=3.2,<3.4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.12.5,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.13,<2",
  "seqfold>=0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7,<9",
  "coverage[toml]>=7,<8",
  "pre-commit>=3,<5",
  "black>=24,<26",
  "mypy>=1,<2",
]

[project.scripts]
genomic_region_generator = "oligo_designer_toolsuite.pipelines._genomic_region_generator:main"
oligo_seq_probe_designer = "oligo_designer_toolsuite.pipelines._oligo_seq_probe_designer:main"
scrinshot_probe_designer = "oligo_designer_toolsuite.pipelines._scrinshot_probe_designer:main"
seqfish_plus_probe_designer = "oligo_designer_toolsuite.pipelines._seqfish_plus_probe_designer:main"
merfish_probe_designer = "oligo_designer_toolsuite.pipelines._merfish_probe_designer:main"
cycle_hcr_probe_designer = "oligo_designer_toolsuite.pipelines._cycle_hcr_probe_designer:main"
hcr_probe_designer = "oligo_designer_toolsuite.pipelines._hcr_probe_designer:main"

[project.urls]
documentation = "https://oligo-designer-toolsuite.readthedocs.io/"
repository = "https://github.com/HelmholtzAI-Consultants-Munich/oligo-designer-toolsuite"


[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.black]
line-length = 110
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 110

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

# Ignore missing imports for third-party packages
[[tool.mypy.overrides]]
module = [
  "effidict.*",
  "joblib.*",
  "cyvcf2.*",
  "seqfold.*",
  "joblib_progress.*",
  "biopython.*",
  "Bio.*",
]
ignore_missing_imports = true
