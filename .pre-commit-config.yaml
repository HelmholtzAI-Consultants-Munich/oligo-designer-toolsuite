
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# taken from: https://github.com/crmne/cookiecutter-modern-datascience/blob/master/.pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=300000']
  - repo: https://github.com/myint/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-duplicate-keys
          - --remove-unused-variables
          - --remove-all-unused-imports
          - --expand-star-imports
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=110']
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [
          "types-PyYAML",
          "types-setuptools",
          "types-networkx",
          "pydantic>=2.12.5,<3",
        ]
        args: [--ignore-missing-imports, --follow-imports=silent]
  - repo: local
    hooks:
      # needs uv; `uv run` creates/syncs the project environment and installs the package in it
      - id: add-yaml-descriptions
        name: add pydantic descriptions to pipeline configs
        entry: uv run python -m oligo_designer_toolsuite.config._yaml_descriptions
        language: system
        # also on model changes, so an edited description is written into all pipeline configs
        files: ^(data/configs/.*\.yaml|oligo_designer_toolsuite/config/.*\.py)$
        pass_filenames: false
        args: [data/configs]

# run all hooks: pre-commit run --all-files
