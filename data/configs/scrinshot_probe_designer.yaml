#######################
### USER PARAMETERS ###
#######################

schema_version: 2

general:
  n_jobs: 4 # number of cores used to run the pipeline and 2*n_jobs +1 of regions that should be stored in cache. If memory consumption of pipeline is too high reduce this number, if a lot of RAM is available increase this number to decrease runtime
  dir_output: output_scrinshot_probe_designer # name of the directory where the output files will be written
  write_intermediate_steps: true # if true, writes the oligo sequences after each step of the pipeline into a csv file

target_probe:
  file_regions: data/genes/custom_3.txt # file with a list the genes used to generate the oligos sequences, leave empty if all the genes are used
  files_fasta_database: # fasta file with sequences form which the probes should be generated. Hint: use the genomic_region_generator pipeline to create fasta files of genomic regions of interest
    - data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
    - data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
  files_fasta_reference_database: # fasta file with sequences used as reference for the specificity filters. Hint: use the genomic_region_generator pipeline to create fasta files of genomic regions of interest
    - data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
    - data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
  length_min: 40 #min length of probe
  length_max: 45 #max length of probe
  isoform_consensus: 50 #min isoform consesnsus for probes, i.e. how many transcripts of the total number of transcripts of a gene are covered by the probe, given in %
  GC_content_min: 40 # minimum GC content of oligos
  GC_content_opt: 50 # max and min values are defiend above
  GC_content_max: 60 # maximum GC content of oligos
  Tm_min: 65 # minimum GC content of oligos
  Tm_opt: 70 # max and min values are defiend above
  Tm_max: 75 # maximum GC content of oligos
  homopolymeric_base_n: # minimum number of nucleotides to consider it a homopolymeric run per base
    A: 5
    T: 5
    C: 5
    G: 5
  padlock_arm_Tm_dif_max: 2 # maximum melting temperature difference of both arms (difference shouldn't be higher than 5! But range is not super important, the lower the better)
  padlock_arm_length_min: 10 # minimum length of each arm
  padlock_arm_Tm_min: 50 # minimum melting temperature of each arm
  padlock_arm_Tm_max: 60 # maximum melting temperature of each arm
  ligation_region_size: 5 # size of the seed region around the ligation site for blast seed region filter; set to 0 if ligation region should not be considered for blast search
  n_sets: 3 # number of sets to generate
  set_size_min: 3 # minimum size of probe sets (in case there exist no set of the optimal size) -> genes with less oligos will be filtered out and stored in regions_with_insufficient_oligos_for_db_probes
  set_size_opt: 5 # optimal size of probe sets
  distance_between_target_probes: 0 # how much overlap should be allowed between oligos, e.g. if oligos can overlpap x bases choose -x, if oligos can be next to one another choose 0, if oligos should be x bases apart choose x
  isoform_weight: 2 # weight of the isoform consensus of the probe in the efficiency score
  GC_weight: 1 # weight of the GC content of the probe in the efficiency score
  Tm_weight: 1 # weight of the Tm of the probe in the efficiency score
detection_probe:
  min_thymines: 2 # minimal number of Thymines in detection oligo.
  length_min: 15 # minimum length of detection probe
  length_max: 40 # maximum length of detection probe
  U_distance: 5 # preferred minimal distance between U(racils)
  Tm_opt: 56 # optimal melting temperature of detection probe


############################
### DEVELOPER PARAMETERS ###
############################

developer_param:
  target_probe:
    # Specificity filter with BlastN
    specificity_blastn_search_parameters:
      -perc_identity: 80
      -strand: "minus" # this parameter is fixed, if reference is whole genome, consider using "both"
      -word_size: 10
      -dust: "no"
      -soft_masking: "false"
      -max_target_seqs: 10
      -max_hsps: 1000
    specificity_blastn_hit_parameters:
      coverage: 50 # can be turned into min_alignment_length
    # Crosshybridization filter with BlastN
    cross_hybridization_blastn_search_parameters:
      -perc_identity: 80
      -strand: "minus" # this parameter is fixed
      -word_size: 10
      -dust: "no"
      -soft_masking: "false"
      -max_target_seqs: 10
    cross_hybridization_blastn_hit_parameters:
      coverage: 80 # can be turned into min_alignment_length
    # Parameters for Melting Temperature
    # The melting temperature is used in 2 different stages (property filters and padlock detection probe design), where a few parameters are shared and the others differ.
    # parameters for melting temperature -> for more information on parameters, see: https://biopython.org/docs/1.75/api/Bio.SeqUtils.MeltingTemp.html#Bio.SeqUtils.MeltingTemp.Tm_NN
    Tm_parameters:
      mode: custom
      parameters:
        nn_table: DNA_NN3 # Allawi & SantaLucia (1997)
        tmm_table: DNA_TMM1 #default
        imm_table: DNA_IMM1 #default
        de_table: DNA_DE1 #default
        dnac1: 50 #[nM]
        dnac2: 0 #[nM]
        saltcorr: 7 # Owczarzy et al. (2008)
        Na: 39 #[mM]
        K: 75 #[mM]
        Tris: 20 #[mM]
        Mg: 10 #[mM]
        dNTPs: 0 #[mM] default
    Tm_chem_correction_parameters:
      mode: custom
      parameters:
        DMSO: 0 #default
        DMSOfactor: 0.75 #default
        fmd: 20
        fmdfactor: 0.65 #default
        fmdmethod: 1 #default
        GC: null #default
    Tm_salt_correction_parameters:
      mode: disabled
  detection_probe:
    # Parameters for Melting Temperature
    # The melting temperature is used in 2 different stages (property filters and padlock detection probe design), where a few parameters are shared and the others differ.
    # parameters for melting temperature -> for more information on parameters, see: https://biopython.org/docs/1.75/api/Bio.SeqUtils.MeltingTemp.html#Bio.SeqUtils.MeltingTemp.Tm_NN
    Tm_parameters:
      mode: custom
      parameters:
        nn_table: DNA_NN3 # Allawi & SantaLucia (1997)
        tmm_table: DNA_TMM1 #default
        imm_table: DNA_IMM1 #default
        de_table: DNA_DE1 #default
        dnac1: 50 #[nM]
        dnac2: 0 #[nM]
        saltcorr: 7 # Owczarzy et al. (2008)
        Na: 39 #[mM]
        K: 0 #[mM] default
        Tris: 0 #[mM] default
        Mg: 0 #[mM] default
        dNTPs: 0 #[mM] default
    Tm_chem_correction_parameters:
      mode: custom
      parameters:
        DMSO: 0 #default
        DMSOfactor: 0.75 #default
        fmd: 30
        fmdfactor: 0.65 #default
        fmdmethod: 1 #default
        GC: null #default
    Tm_salt_correction_parameters:
      mode: disabled
  oligo_set_selection:
    # Parameters for the Oligo set selection
    n_attempts_graph: 20 # number of randomized graph attempts (diversification)
    n_attempts_clique_enum: 70 # max cliques enumerated per graph attempt
    diversification_fraction: 0.1 # fraction of oligos to remove from the graph to create diversity in the set selection
    jaccard_opt: 0.5 # optimal maximum Jaccard overlap between selected sets
    jaccard_step: 0.1 # step size for the Jaccard overlap if not enough sets are found
