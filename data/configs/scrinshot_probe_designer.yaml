###############################
### PROBE DESIGN PARAMETERS ###
###############################

##### REQUIRED PARAMETERS #####
# The following parameters need to be adjusted to the target genes you want to design probes for.

required_parameters:
  targets: "data/genes/custom_3.txt"
  target_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
  reference_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"

##### TARGET PROBES PARAMETERS #####
# All following parameters are default parameters taken from TBD

target_probes:
  oligo_generation:
    probe_length_min: 40
    probe_length_max: 45

  padlock_arms_properties:
    length_min: 10
    Tm_dif_max: 2
    Tm_min: 50
    Tm_max: 60

  property_filters:
    isoform_consensus_filter:
      enabled: true
      isoform_consensus: 50

    hard_masked_sequences_filter:
      enabled: true

    soft_masked_sequences_filter:
      enabled: true

    homopolymeric_runs_filter:
      enabled: true
      homopolymeric_base_n: {"A": 5, "T": 5, "C": 5, "G": 5}

    GC_content_filter:
      enabled: true
      GC_content_min: 40
      GC_content_max: 60

    Tm_filter:
      enabled: true
      Tm_min: 65
      Tm_max: 75

  specificity_filters:
    specificity_blastn_filter:
      enabled: true
      ligation_region_size: 5
      search_parameters: {"-task": "blastn", "-perc_identity": 80, "-strand": "minus", "-word_size": 10, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
      hit_parameters:
        hit_criterion: "coverage"
        value: 50

    cross_hybridization_blastn_filter:
      enabled: true
      search_parameters: {"-task": "blastn", "-perc_identity": 80, "-strand": "minus", "-word_size": 10, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
      hit_parameters:
        hit_criterion: "coverage"
        value: 80

  probe_set_selection:
    independent_set_selection:
      n_sets: 1
      set_size_min: 3
      set_size_opt: 5
      distance_between_probes: 0
      n_attempts_graph: 20
      n_attempts_clique_enum: 70
      diversification_fraction: 0.1
      jaccard_opt: 0.5
      jaccard_step: 0.1
    isoform_consensus_score:
      weight: 2
    GC_content_score:
      weight: 1
      GC_content_min: 40
      GC_content_opt: 50
      GC_content_max: 60
    Tm_score:
      weight: 1
      Tm_min: 65
      Tm_opt: 70
      Tm_max: 75

  Tm_parameters:
    Tm_NN_parameters:
      nn_table: "DNA_NN3"
      tmm_table: "DNA_TMM1"
      imm_table: "DNA_IMM1"
      de_table: "DNA_DE1"
      dnac1: 50
      dnac2: 0
      saltcorr: 7
      Na: 39
      K: 75
      Tris: 20
      Mg: 10
      dNTPs: 0
    Tm_chem_correction_parameters:
      enabled: true
      parameters:
        DMSO: 0
        DMSOfactor: 0.75
        fmd: 20
        fmdfactor: 0.65
        fmdmethod: 1
        GC: null
    Tm_salt_correction_parameters:
      enabled: false

##### DETECTION OLIGO PARAMETERS #####
# All following parameters are default parameters taken from TBD

detection_oligo:
  oligo_generation:
    min_thymines: 2
    oligo_length_min: 15
    oligo_length_max: 40
    U_distance: 5
    Tm_opt: 56

  Tm_parameters:
    Tm_NN_parameters:
      nn_table: "DNA_NN3"
      tmm_table: "DNA_TMM1"
      imm_table: "DNA_IMM1"
      de_table: "DNA_DE1"
      dnac1: 50
      dnac2: 0
      saltcorr: 7
      Na: 39
      K: 0
      Tris: 0
      Mg: 0
      dNTPs: 0
    Tm_chem_correction_parameters:
      enabled: true
      parameters:
        DMSO: 0
        DMSOfactor: 0.75
        fmd: 30
        fmdfactor: 0.65
        fmdmethod: 1
        GC: null
    Tm_salt_correction_parameters:
      enabled: false

############################
### EXECUTION PARAMETERS ###
############################

schema_version: 2

