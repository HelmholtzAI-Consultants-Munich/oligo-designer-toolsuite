#########################
### HIDDEN PARAMETERS ###
#########################

schema_version: 2

general:
  n_jobs: 4
  dir_output: "output_seqfishplus_probe_designer"
  write_intermediate_steps: true

#######################
### USER PARAMETERS ###
#######################

required_parameters:
  targets: "data/genes/custom_3.txt"
  target_genome:
      - "data/genomic_regions/cds_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/utr_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
  reference_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"

target_probes:
  oligo_generation:
    probe_length_min: 28
    probe_length_max: 28

  property_filters:
    isoform_consensus_filter:
      enabled: true
      isoform_consensus: 100

    hard_masked_sequences_filter:
      enabled: true

    soft_masked_sequences_filter:
      enabled: true

    homopolymeric_runs_filter:
      enabled: true
      homopolymeric_base_n: {"A": 5, "T": 5, "C": 5, "G": 5}

    GC_content_filter:
      enabled: true
      GC_content_min: 45
      GC_content_max: 65

    secondary_structure_filter:
      enabled: true
      T: 76
      thr_DG: 0

  specificity_filters:
    specificity_blastn_filter:
      enabled: true
      search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
      hit_parameters:
        hit_criterion: "min_alignment_length"
        value: 15

    cross_hybridization_blastn_filter:
      enabled: true
      search_parameters: {"-perc_identity": 80, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
      hit_parameters:
        hit_criterion: "min_alignment_length"
        value: 17

  probe_set_selection:
    independent_set_selection:
      n_sets: 3
      set_size_min: 24
      set_size_opt: 24
      distance_between_probes: 2
      n_attempts_graph: 50
      n_attempts_clique_enum: 50
      diversification_fraction: 0.1
      jaccard_opt: 0.5
      jaccard_step: 0.1
    GC_content_score:
      weight: 1
      GC_content_opt: 55
    UTR_score:
      weight: 10

readout_probes:

  codebook:
    source: "generate"
    file: null

    n_barcode_rounds: 4
    n_pseudocolors: 4
    channels_ids: ["Alexa488", "Cy3b", "Alexa647"]

  readout_probe_table:
    source: "generate"
    file: null

    oligo_generation:
      probe_length: 15
      base_probabilities: {"A": 0.25, "C": 0.25, "G": 0.25, "T": 0.25}
      initial_num_sequences: 100000

    property_filters:
      homopolymeric_runs_filter:
        enabled: true
        homopolymeric_base_n: {"G": 3}

      GC_content_filter:
        enabled: true
        GC_content_min: 40
        GC_content_max: 60

    specificity_filters:
      specificity_blastn_filter:
        enabled: true
        search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 10

      cross_hybridization_blastn_filter:
        enabled: true
        search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 10

primers:
  forward_primer:
    source: "generate"
    sequence: null

    oligo_generation:
      probe_length: 20
      base_probabilities: {"A": 0.25, "C": 0.25, "G": 0.25, "T": 0.25}
      initial_num_sequences: 1000000

    property_filters:
      homopolymeric_runs_filter:
        enabled: true
        homopolymeric_base_n: {"A": 4, "T": 4, "C": 4, "G": 4}

      GC_content_filter:
        enabled: true
        GC_content_min: 50
        GC_content_max: 65

      GC_clamp_filter:
        enabled: true
        number_GC_GCclamp: 1
        number_three_prime_base_GCclamp: 2

      self_complementarity_filter:
        enabled: true
        max_len_selfcomplement: 6

      complement_reverse_primer_filter:
        enabled: true
        max_len_complement: 5

      Tm_filter:
        enabled: true
        Tm_min: 60
        Tm_max: 75

      secondary_structure_filter:
        enabled: true
        T: 76
        thr_DG: 0

    specificity_filters:
      specificity_blastn_filter:
        enabled: true
        search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 14

      hybridization_probes_blastn_filter:
        enabled: true
        search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 11

    shared_parameters:
      Tm_parameters:
        nn_table: "DNA_NN4"
        tmm_table: "DNA_TMM1"
        imm_table: "DNA_IMM1"
        de_table: "DNA_DE1"
        dnac1: 250
        dnac2: 250
        saltcorr: 5
        Na: 300
        K: 0
        Tris: 0
        Mg: 0
        dNTPs: 0
      Tm_chem_correction_parameters:
        enabled: false
      Tm_salt_correction_parameters:
        enabled: false

  reverse_primer:
    source: "load"
    sequence: "CCCTATAGTGAGTCGTATTA"
