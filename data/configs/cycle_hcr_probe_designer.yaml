#########################
### HIDDEN PARAMETERS ###
#########################

schema_version: 2

general:
  n_jobs: 4 # number of cores used to run the pipeline and 2*n_jobs +1 of regions that should be stored in cache. If memory consumption of pipeline is too high reduce this number, if a lot of RAM is available increase this number to decrease runtime
  dir_output: output_cyclehcr_probe_designer # name of the directory where the output files will be written
  write_intermediate_steps: true # if true, saves intermediate results after each step

#######################
### USER PARAMETERS ###
#######################

required_parameters:
  targets: data/genes/custom_3.txt # Path to file listing gene/region IDs to design probes for. Empty = use all genes from the FASTA.
  target_genome: # FASTA file(s) from which oligo sequences are generated. Use genomic_region_generator for custom regions.
      - data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
      - data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
  reference_genome: # FASTA file(s) used as reference for specificity.
      - data/genomic_regions/gene_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna

target_probes:
  oligo_generation:
    L_probe_sequence_length: 45 # Length (bases) of the L arm of the probe; L + gap + R should equal the total probe length, e.g. 45 + 2 + 45 = 92.
    gap_sequence_length: 2 # Length (bases) of the spacer between the L and R arms (covers the junction site).
    R_probe_sequence_length: 45 # Length (bases) of the R arm of the probe; L + gap + R should equal the total probe length, e.g. 45 + 2 + 45 = 92.

  property_filters:
    isoform_consensus_filter: # Require oligos to be supported by a minimum fraction of gene transcripts.
      enabled: true # Turn this filter on or off.
      isoform_consensus: 0 # Minimum isoform consensus (%). Oligos must be covered by at least this fraction of a gene's transcripts.

    hard_masked_sequences_filter: # Exclude oligos overlapping hard-masked (e.g. N) regions in the reference.
      enabled: true # Turn this filter on or off.

    soft_masked_sequences_filter: # Exclude oligos overlapping soft-masked (lowercase) regions in the reference.
      enabled: false # Turn this filter on or off.

    homopolymeric_runs_filter: # Exclude oligos containing long homopolymeric runs (e.g. AAAAAA).
      enabled: true # Turn this filter on or off.
      homopolymeric_base_n: {"A": 6, "T": 6, "C": 6, "G": 6} # Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.

    GC_content_filter: # Enforce GC content within a specified range.
      enabled: true # Turn this filter on or off.
      GC_content_min: 30 # Minimum GC content (%). Oligos below this are rejected.
      GC_content_max: 90 # Maximum GC content (%). Oligos above this are rejected.

    Tm_filter: # Enforce melting temperature (Tm) within a range (uses Tm parameters below).
      enabled: true # Turn this filter on or off.
      Tm_min: 75 # Minimum melting temperature (°C). Oligos below this are rejected.
      Tm_max: 100 # Maximum melting temperature (°C). Oligos above this are rejected.

    secondary_structure_filter: # Reject oligos with stable secondary structure at the given temperature.
      enabled: true # Turn this filter on or off.
      T: 90 # Temperature (°C) at which secondary structure free energy is evaluated.
      thr_DG: 0 # Free-energy threshold (kcal/mol). Oligos with ΔG ≤ thr_DG (stable structure) are rejected.

  specificity_filters:
    specificity_blastn_filter: # Ensure oligo specificity against a reference database (BLAST-based).
      enabled: true # Turn this filter on or off.
      junction_region_size: 13 # Size of the seed region around the junction site for the BLAST seed-region filter; set to 0 to skip seed-region filtering.
      search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 10, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000} # BLAST options for the specificity search.
      hit_parameters: # Hit criteria (e.g. coverage %). Hits satisfying these lead to oligo rejection.
        hit_criterion: "coverage"
        value: 90

    cross_hybridization_blastn_filter: # Remove L/R arms that may cross-hybridize to off-target sequences (BLAST-based).
      enabled: true # Turn this filter on or off.
      search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10} # BLAST options for the cross-hybridization search.
      hit_parameters: # Hit criteria (e.g. coverage %). Hits satisfying these lead to oligo rejection.
        hit_criterion: "coverage"
        value: 90

  probe_set_selection: # Parameters for selecting multiple probe sets per gene (size, spacing, scoring, diversification).
    independent_set_selection:
      n_sets: 3 # Number of probe sets to generate per gene.
      set_size_min: 10 # Minimum set size. Genes that cannot form a set of at least this size are reported as insufficient.
      set_size_opt: 25 # Preferred (optimal) number of oligos per set.
      distance_between_probes: 2 # Required spacing: negative = allow overlap (bases), 0 = adjacent OK, positive = minimum gap (bases).
      n_attempts_graph: 50 # Number of randomized graph attempts used to diversify set selection.
      n_attempts_clique_enum: 50 # Maximum cliques enumerated per graph attempt.
      diversification_fraction: 0.1 # Fraction of oligos removed from the graph in each attempt to increase set diversity.
      jaccard_opt: 0.5 # Target maximum Jaccard similarity between selected sets; lower = more distinct sets.
      jaccard_step: 0.1 # Step size for relaxing Jaccard threshold when too few sets are found.
    isoform_consensus_score:
      weight: 10 # Weight for isoform coverage in the set-selection scoring function.
    Tm_score:
      weight: 1 # Weight for Tm in the set-selection scoring function.
      Tm_opt: 75 # Target (optimal) Tm (°C) for scoring; CycleHCR aims for the highest stable Tm so the value matches Tm_max above.

  global_parameters:
    Tm_parameters:
      nn_table: DNA_NN3 # default
      tmm_table: DNA_TMM1 # default
      imm_table: DNA_IMM1 # default
      de_table: DNA_DE1 # default
      dnac1: 25 #[nM]
      dnac2: 25 #[nM]
      saltcorr: 0
      Na: 50 #[mM]
      K: 0 #[mM] default
      Tris: 0 #[mM] default
      Mg: 0 #[mM] default
      dNTPs: 0 #[mM] default
    Tm_chem_correction_parameters:
      enabled: false
    Tm_salt_correction_parameters:
      enabled: false

readout_probes:
  codebook:
    source: generate # "generate" (default) | "load"
    file: # example file can be found at: data/functional_oligos/cycle_hcr_codebook.tsv; codebook file: columns = "bits", rows = "gene_name"; entries are 0/1 bit-encodings for each gene.
    min_hamming_distance: 4 # only used when source = "generate"; required minimum Hamming distance between codewords. Must be one of 0, 2, or 4 (codewords have weight 2, so no other values are achievable). 4 enables single-bit error detection but limits capacity to n_readout_probes_LR * n_channels regions.
  readout_probe_table:
    source: load # "generate" | "load" (default)
    file: data/functional_oligos/cycle_hcr_readout_probes_generate_codebook.tsv # csv/tsv file containing the readout probe table with the columns "channel", "readout_probe_id", "readout_probe_sequence", "L/R". Bit handling depends on codebook.source: when codebook.source = "load" the file MUST also contain a "bit" column whose values match the codebook columns (the user is responsible for that mapping); when codebook.source = "generate" any "bit" column is ignored and bits are reassigned deterministically by sorting on (readout_probe_id, channel, L/R).

primers:
  forward_primer: # Forward PCR primer placed at the 5' end of the DNA template probe.
    source: load  # "generate" | "load" (default)
    sequence: TAATACGACTCACTATAGCGTCATC # T7 promoter sequence.
  reverse_primer: # Reverse PCR primer placed at the 3' end of the DNA template probe.
    source: load  # "generate" | "load" (default)
    sequence: CGACACCGAACGTGCGACAA

hybridization_probes:
  linker_sequence: TT # Linker sequence between the target-binding L/R arm and the readout-probe barcode (used by both hybridization and DNA template assembly).
