schema_version: 2

####################
### RUN SETTINGS ###
####################

general:
  n_jobs: 4
  dir_output: "output_cyclehcr_probe_designer"
  write_intermediate_steps: true

###############################
### PROBE DESIGN PARAMETERS ###
###############################

required_parameters:
  targets: "data/genes/custom_3.txt"
  target_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
  reference_genome:
      - "data/genomic_regions/gene_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"

target_probes:
  oligo_generation:
    L_probe_sequence_length: 45
    gap_sequence_length: 2
    R_probe_sequence_length: 45

  property_filters:
    isoform_consensus_filter:
      enabled: true
      isoform_consensus: 0

    hard_masked_sequences_filter:
      enabled: true

    soft_masked_sequences_filter:
      enabled: false

    homopolymeric_runs_filter:
      enabled: true
      homopolymeric_base_n: {"A": 6, "T": 6, "C": 6, "G": 6}

    GC_content_filter:
      enabled: true
      GC_content_min: 30
      GC_content_max: 90

    Tm_filter:
      enabled: true
      Tm_min: 75
      Tm_max: 100

    secondary_structure_filter:
      enabled: true
      T: 90
      thr_DG: 0

  specificity_filters:
    specificity_blastn_filter:
      enabled: true
      junction_region_size: 13
      search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 10, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
      hit_parameters:
        hit_criterion: "coverage"
        value: 90

    cross_hybridization_blastn_filter:
      enabled: true
      search_parameters: {"-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
      hit_parameters:
        hit_criterion: "coverage"
        value: 90

  probe_set_selection:
    independent_set_selection:
      n_sets: 3
      set_size_min: 10
      set_size_opt: 25
      distance_between_probes: 2
      n_attempts_graph: 50
      n_attempts_clique_enum: 50
      diversification_fraction: 0.1
      jaccard_opt: 0.5
      jaccard_step: 0.1
    isoform_consensus_score:
      weight: 10
    Tm_score:
      weight: 1
      Tm_opt: 75

  shared_parameters:
    Tm_parameters:
      nn_table: "DNA_NN3"
      tmm_table: "DNA_TMM1"
      imm_table: "DNA_IMM1"
      de_table: "DNA_DE1"
      dnac1: 25
      dnac2: 25
      saltcorr: 0
      Na: 50
      K: 0
      Tris: 0
      Mg: 0
      dNTPs: 0
    Tm_chem_correction_parameters:
      enabled: false
    Tm_salt_correction_parameters:
      enabled: false

readout_probes:
  codebook:
    source: "generate"
    file:
    min_hamming_distance: 4
  readout_probe_table:
    source: "load"
    file: "data/functional_oligos/cycle_hcr_readout_probes_generate_codebook.tsv"

primers:
  forward_primer:
    source: "load"
    sequence: "TAATACGACTCACTATAGCGTCATC"
  reverse_primer:
    source: "load"
    sequence: "CGACACCGAACGTGCGACAA"

hybridization_probes:
  linker_sequence: "TT"
