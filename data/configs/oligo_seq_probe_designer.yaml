#########################
### HIDDEN PARAMETERS ###
#########################

schema_version: 2

general:
  n_jobs: 4
  dir_output: "output_oligo_seq_probe_designer"
  write_intermediate_steps: true

#######################
### USER PARAMETERS ###
#######################

required_parameters:
  targets: "data/genes/custom_3.txt"
  target_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
  reference_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"

target_probes:
  oligo_generation:
    probe_length_min: 26
    probe_length_max: 30
    probe_split_region: 4

  property_filters:
    isoform_consensus_filter:
      enabled: true
      isoform_consensus: 0

    targeted_exons_filter:
      enabled: false
      targeted_exons: ["1", "2", "3"]

    hard_masked_sequences_filter:
      enabled: true

    soft_masked_sequences_filter:
      enabled: true

    homopolymeric_runs_filter:
      enabled: true
      homopolymeric_base_n: {"A": 6, "T": 6, "C": 6, "G": 6}

    GC_content_filter:
      enabled: true
      GC_content_min: 45
      GC_content_max: 65

    prohibited_sequences_filter:
      enabled: true
      prohibited_sequences: ["TCT", "CTC"]
      kmer_abundance_threshold: {3: 0.0469, 4: 0.0117, 5: 0.0029, 6: 0.00073}

    self_complementarity_filter:
      enabled: true
      max_len_selfcomplement: 10

    Tm_filter:
      enabled: true
      Tm_min: 50
      Tm_max: 70

    secondary_structure_filter:
      enabled: true
      T: 37
      thr_DG: 0

  specificity_filters:
    read_length_bias_filter:
      enabled: true
      read_length_bias: 20

    specificity_blastn_filter:
      enabled: true
      search_parameters: {"-perc_identity": 80, "-strand": "minus", "-word_size": 10}
      hit_parameters:
        hit_criterion: "coverage"
        value: 50

    cross_hybridization_blastn_filter:
      enabled: true
      search_parameters: {"-perc_identity": 80, "-strand": "minus", "-word_size": 10}
      hit_parameters:
        hit_criterion: "coverage"
        value: 50

    variant_filter:
      enabled: true
      files_vcf_reference_database:
        - "data/annotations/custom_GCF_000001405.40.chr16.vcf"
      action: "flag"

  probe_set_selection:
    independent_set_selection:
      n_sets: 3
      set_size_min: 3
      set_size_opt: 5
      distance_between_probes: 0
      n_attempts_graph: 50
      n_attempts_clique_enum: 50
      diversification_fraction: 0.1
      jaccard_opt: 0.5
      jaccard_step: 0.1
    uniform_distance_score:
      weight: 1
    isoform_consensus_score:
      weight: 1
    targeted_exons_score:
      weight: 0
      targeted_exons: []
    GC_content_score:
      weight: 1
      GC_content_min: 45
      GC_content_opt: 55
      GC_content_max: 65
    Tm_score:
      weight: 1
      Tm_min: 50
      Tm_opt: 60
      Tm_max: 70


  shared_parameters:
    Tm_parameters:
      nn_table: "DNA_NN3"
      tmm_table: "DNA_TMM1"
      imm_table: "DNA_IMM1"
      de_table: "DNA_DE1"
      dnac1: 50
      dnac2: 0
      saltcorr: 7
      Na: 1000
      K: 0
      Tris: 0
      Mg: 0
      dNTPs: 0
    Tm_chem_correction_parameters:
      enabled: true
      parameters:
        DMSO: 0
        DMSOfactor: 0.75
        fmd: 20
        fmdfactor: 0.65
        fmdmethod: 1
        GC: null
    Tm_salt_correction_parameters:
      enabled: false
