#######################
### USER PARAMETERS ###
#######################

schema_version: 2

general:
  n_jobs: 2 # number of cores used to run the pipeline and 2*n_jobs +1 of regions that should be stored in cache. If memory consumption of pipeline is too high reduce this number, if a lot of RAM is available increase this number to decrease runtime
  dir_output: output_hcr_probe_designer # name of the directory where the output files will be written
  write_intermediate_steps: true # if true, writes the oligo sequences after each step of the pipeline into a csv file

target_probe:
  file_regions: data/genes/custom_3.txt # file with a list the genes used to generate the probe sequences, leave empty if all the genes are used
  files_fasta_database: # fasta file with sequences from which the probes should be generated. Hint: use the genomic_region_generator pipeline to create fasta files of genomic regions of interest
    - data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
    - data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
  files_fasta_reference_database: # fasta file with sequences used as reference for the specificity filters. Hint: use the genomic_region_generator pipeline to create fasta files of genomic regions of interest
    - data/genomic_regions/gene_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
  isoform_consensus: 0 # min isoform consensus for probes, i.e. how many transcripts of the total number of transcripts of a gene are covered by the probe, given in %
  L_probe_sequence_length: 25 # L + gap + R sequence should equal the total probe length, e.g. 25 + 2 + 25 = 52
  gap_sequence_length: 2 # gap between L and R probe sequences
  R_probe_sequence_length: 25 # L + gap + R sequence should equal the total probe length, e.g. 25 + 2 + 25 = 52
  GC_content_min: 40 # minimum GC content of oligos
  GC_content_max: 65 # maximum GC content of oligos
  Tm_min: 50 # minimum melting temperature of oligos
  Tm_max: 80 # maximum melting temperature of oligos
  homopolymeric_base_n: # maximum number of consecutive identical bases allowed per base type
    A: 4
    T: 4
    C: 4
    G: 4
  T_secondary_structure: 37 # temperature (°C) at which secondary structure free energy is calculated
  junction_region_size: 0 # size of the seed region around the junction site for blast seed region filter; set to 0 if junction region should not be considered for blast search
  isoform_weight: 1 # weight of the isoform consensus score in the probe efficiency score
  set_size_min: 10 # minimum size of probe sets -> genes with fewer oligos will be filtered out
  set_size_opt: 25 # optimal size of probe sets
  distance_between_target_probes: 2 # minimum distance between oligos; use negative values to allow overlap
  n_sets: 30 # maximum number of sets to generate
  linker_sequence: AA # linker sequence between initiator and target sequence

initiator_probe:
  file_initiator_table: data/functional_oligos/hcr_initiators.tsv # csv/tsv file with columns "bit", "initiator_L_sequence", and "initiator_R_sequence"
  file_codebook: data/functional_oligos/hcr_codebook.tsv # optional: file containing the codebook, where columns = "bit_*" and rows = "region_id" with 0/1 entries (one-hot)

############################
### DEVELOPER PARAMETERS ###
############################

developer_param:
  # Parameters for property filters
  # parameters for melting temperature -> for more information on parameters, see: https://biopython.org/docs/1.75/api/Bio.SeqUtils.MeltingTemp.html#Bio.SeqUtils.MeltingTemp.Tm_NN
  target_probe:
    Tm_parameters:
      mode: custom
      parameters:
        nn_table: DNA_NN3 # default
        tmm_table: DNA_TMM1 # default
        imm_table: DNA_IMM1 # default
        de_table: DNA_DE1 # default
        dnac1: 25 #[nM]
        dnac2: 25 #[nM]
        saltcorr: 0
        Na: 50 #[mM]
        K: 0 #[mM] default
        Tris: 0 #[mM] default
        Mg: 0 #[mM] default
        dNTPs: 0 #[mM] default
    Tm_chem_correction_parameters:
      mode: disabled
    Tm_salt_correction_parameters:
      mode: disabled
    secondary_structures_threshold_deltaG: -7 # threshold for secondary structure free energy; oligo rejected if a structure with deltaG below this threshold is predicted
    # Specificity filter with BlastN
    specificity_blastn_search_parameters:
      -perc_identity: 100
      -strand: "minus" # this parameter is fixed, if reference is whole genome, consider using "both"
      -word_size: 10
      -dust: "no"
      -soft_masking: "false"
      -max_target_seqs: 10
      -max_hsps: 1000
    specificity_blastn_hit_parameters:
      coverage: 90 # can be turned into min_alignment_length
    # Crosshybridization filter with BlastN
    cross_hybridization_blastn_search_parameters:
      -perc_identity: 100
      -strand: "minus" # this parameter is fixed
      -word_size: 7
      -dust: "no"
      -soft_masking: "false"
      -max_target_seqs: 10
    cross_hybridization_blastn_hit_parameters:
      coverage: 90 # can be turned into min_alignment_length
  # Parameters for the Oligo set selection
  oligo_set_selection:
    n_attempts_graph: 50 # number of randomized graph attempts (diversification)
    n_attempts_clique_enum: 50 # max cliques enumerated per graph attempt
    diversification_fraction: 0.1 # fraction of oligos to remove from the graph to create diversity in the set selection
    jaccard_opt: 0.5 # optimal maximum Jaccard overlap between selected sets
    jaccard_step: 0.1 # step size for the Jaccard overlap if not enough sets are found
