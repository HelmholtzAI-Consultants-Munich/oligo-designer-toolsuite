###############################
### PROBE DESIGN PARAMETERS ###
###############################

##### REQUIRED PARAMETERS #####
# The following parameters need to be adjusted to the target genes you want to design probes for.

required_parameters:
  targets: "data/genes/custom_3.txt"
  target_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
  reference_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"

##### TARGET PROBES PARAMETERS #####
# All following parameters are default parameters taken from TBD

target_probes:
  oligo_generation:
    probe_length_min: 30
    probe_length_max: 30

  property_filters:
    isoform_consensus_filter:
      enabled: true
      isoform_consensus: 50

    hard_masked_sequences_filter:
      enabled: true

    soft_masked_sequences_filter:
      enabled: true

    homopolymeric_runs_filter:
      enabled: true
      homopolymeric_base_n: {"A": 6, "T": 6, "C": 6, "G": 6}

    GC_content_filter:
      enabled: true
      GC_content_min: 43
      GC_content_max: 63

    Tm_filter:
      enabled: true
      Tm_min: 66
      Tm_max: 76

    secondary_structure_filter:
      enabled: true
      T: 76
      thr_DG: 0

  specificity_filters:
    specificity_blastn_filter:
      enabled: true
      search_parameters: {"-task": "blastn", "-perc_identity": 80, "-strand": "minus", "-word_size": 10, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
      hit_parameters:
        hit_criterion: "min_alignment_length"
        value: 17

    cross_hybridization_blastn_filter:
      enabled: true
      search_parameters: {"-task": "blastn", "-perc_identity": 80, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
      hit_parameters:
        hit_criterion: "min_alignment_length"
        value: 17

  probe_set_selection:
    independent_set_selection:
      n_sets: 1
      set_size_min: 50
      set_size_opt: 50
      distance_between_probes: 0
      n_attempts_graph: 50
      n_attempts_clique_enum: 50
      diversification_fraction: 0.1
      jaccard_opt: 0.5
      jaccard_step: 0.1
    GC_content_score:
      weight: 1
      GC_content_opt: 55
    Tm_score:
      weight: 1
      Tm_opt: 72
    isoform_consensus_score:
      weight: 2

  Tm_parameters:
    Tm_NN_parameters:
      nn_table: "DNA_NN4"
      tmm_table: "DNA_TMM1"
      imm_table: "DNA_IMM1"
      de_table: "DNA_DE1"
      dnac1: 5
      dnac2: 0
      saltcorr: 5
      Na: 300
      K: 0
      Tris: 0
      Mg: 0
      dNTPs: 0
    Tm_chem_correction_parameters:
      enabled: false
    Tm_salt_correction_parameters:
      enabled: false

##### READOUT PROBES PARAMETERS #####
# All following parameters are default parameters taken from TBD

readout_probes:
  codebook:
    source: "generate"
    file: null
    n_bits: 16
    min_hamming_dist: 4
    hamming_weight: 2

  readout_probe_table:
    source: "generate"
    file: null
    channels_ids: ["Alexa488", "Cy3b", "Alexa647"]

    oligo_generation:
      probe_length: 20
      base_probabilities: {"A": 0.25, "C": 0.00, "G": 0.50, "T": 0.25}
      initial_num_sequences: 100000

    property_filters:
      homopolymeric_runs_filter:
        enabled: true
        homopolymeric_base_n: {"G": 3}

      GC_content_filter:
        enabled: true
        GC_content_min: 40
        GC_content_max: 50

    specificity_filters:
      specificity_blastn_filter:
        enabled: true
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 11

      cross_hybridization_blastn_filter:
        enabled: true
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 11

    probe_set_selection:
      set_size: 16
      n_combinations: 100000
      homogeneous_properties_weights: {TmNN_oligo: 1.0, GC_content_oligo: 1.0}

    Tm_parameters:
      Tm_NN_parameters:
        nn_table: "DNA_NN4"
        tmm_table: "DNA_TMM1"
        imm_table: "DNA_IMM1"
        de_table: "DNA_DE1"
        dnac1: 25
        dnac2: 25
        saltcorr: 5
        Na: 300
        K: 0
        Tris: 0
        Mg: 0
        dNTPs: 0
      Tm_chem_correction_parameters:
        enabled: false
      Tm_salt_correction_parameters:
        enabled: false

##### PRIMERS PARAMETERS #####
# All following parameters are default parameters taken from TBD

primers:
  forward_primer:
    source: "generate"
    sequence: null

    oligo_generation:
      probe_length: 20
      base_probabilities: {"A": 0.25, "C": 0.25, "G": 0.25, "T": 0.25}
      initial_num_sequences: 1000000

    property_filters:
      homopolymeric_runs_filter:
        enabled: true
        homopolymeric_base_n: {"A": 4, "T": 4, "C": 4, "G": 4}

      GC_content_filter:
        enabled: true
        GC_content_min: 50
        GC_content_max: 65

      GC_clamp_filter:
        enabled: true
        number_GC_GCclamp: 1
        number_three_prime_base_GCclamp: 2

      self_complementarity_filter:
        enabled: true
        max_len_selfcomplement: 6

      complement_reverse_primer_filter:
        enabled: true
        max_len_complement: 5

      Tm_filter:
        enabled: true
        Tm_min: 60
        Tm_max: 75

      secondary_structure_filter:
        enabled: true
        T: 76
        thr_DG: 0

    specificity_filters:
      specificity_blastn_filter:
        enabled: true
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 14

      hybridization_probes_blastn_filter:
        enabled: true
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        hit_parameters:
          hit_criterion: "min_alignment_length"
          value: 11

    Tm_parameters:
      Tm_NN_parameters:
        nn_table: "DNA_NN4"
        tmm_table: "DNA_TMM1"
        imm_table: "DNA_IMM1"
        de_table: "DNA_DE1"
        dnac1: 250
        dnac2: 250
        saltcorr: 5
        Na: 300
        K: 0
        Tris: 0
        Mg: 0
        dNTPs: 0
      Tm_chem_correction_parameters:
        enabled: false
      Tm_salt_correction_parameters:
        enabled: false

  reverse_primer:
    source: "load"
    sequence: "CCCTATAGTGAGTCGTATTA"

############################
### EXECUTION PARAMETERS ###
############################

