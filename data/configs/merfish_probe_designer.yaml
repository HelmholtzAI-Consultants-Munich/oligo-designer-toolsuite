###############################
### PROBE DESIGN PARAMETERS ###
###############################

##### REQUIRED PARAMETERS #####
# The following parameters need to be adjusted to the target genes you want to design probes for.

#: Parameters required for target probe generation. The reference genome is reused for all specificity filters
#: for all probes.
required_parameters:
  #: Path to file listing gene/region IDs to design probes for. Empty = use all genes from the FASTA.
  targets: "data/genes/custom_3.txt"
  #: FASTA file(s) from which the target oligo sequences are generated. Use genomic_region_generator for
  #: custom regions.
  target_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
  #: FASTA file(s) used as reference for all specificity filters (e.g. with BLAST).
  reference_genome:
      - "data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"
      - "data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna"

##### TARGET PROBES PARAMETERS #####
# All following parameters are default parameters taken from TBD

target_probes:
  #: Parameters that determine length and spacing of the probes.
  oligo_generation:
    #: Minimum allowed oligo length (bases)
    probe_length_min: 30
    #: Maximum allowed oligo length (bases).
    probe_length_max: 30

  #: Parameters for filters that depend on properties of the filters (e.g., melting temperature).
  property_filters:
    #: Require oligos to be supported by a minimum fraction of gene transcripts.
    isoform_consensus_filter:
      #: Turn this filter on or off.
      enabled: true
      #: Minimum isoform consensus (%). Oligos must be covered by at least this fraction of a gene's
      #: transcripts.
      isoform_consensus: 50

    #: Exclude oligos overlapping hard-masked (e.g. N) regions in the reference.
    hard_masked_sequences_filter:
      #: Turn this filter on or off.
      enabled: true

    #: Exclude oligos overlapping soft-masked (lowercase) regions in the reference.
    soft_masked_sequences_filter:
      #: Turn this filter on or off.
      enabled: true

    #: Exclude oligos containing long homopolymeric runs (e.g. AAAAA).
    homopolymeric_runs_filter:
      #: Turn this filter on or off.
      enabled: true
      #: Minimum run length per base to count as homopolymeric (any base not listed is unrestricted). Oligos
      #: with longer runs are rejected.
      #:   A: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
      #:   T: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
      #:   C: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
      #:   G: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
      homopolymeric_base_n: {"A": 6, "T": 6, "C": 6, "G": 6}

    #: Enforce GC content within a specified range.
    GC_content_filter:
      #: Turn this filter on or off.
      enabled: true
      #: Minimum GC content (%). Oligos below this are rejected.
      GC_content_min: 43
      #: Maximum GC content (%). Oligos above this are rejected.
      GC_content_max: 63

    #: Enforce melting temperature (Tm) within a range (additionally uses Tm parameters).
    Tm_filter:
      #: Turn this filter on or off.
      enabled: true
      #: Minimum melting temperature (°C). Oligos below this are rejected.
      Tm_min: 66
      #: Maximum melting temperature (°C). Oligos above this are rejected.
      Tm_max: 76

    #: Reject oligos with stable secondary structure at the given temperature.
    secondary_structure_filter:
      #: Turn this filter on or off.
      enabled: true
      #: Temperature (°C) at which secondary structure free energy is evaluated.
      T: 76
      #: Free-energy threshold (kcal/mol). Oligos with ΔG ≤ thr_DG (stable structure) are rejected.
      thr_DG: 0

  #: Parameters for filters that test the specificity of the probes.
  specificity_filters:
    #: Ensure oligo specificity against a reference database (BLAST-based).
    specificity_blastn_filter:
      enabled: true
      #: BLAST options for the specificity search.
      #:   -task: Supported tasks.
      #:   -perc_identity: Percent identity cutoff.
      #:   -strand: Query strand(s) to search against database/subject. Choice of both, minus, or plus.
      #:   -word_size: Length of initial exact match.
      #:   -dust: Filter query sequence with dust.
      #:   -soft_masking: Apply filtering locations as soft masks (i.e., only for finding initial matches).
      #:   -max_target_seqs: Maximum number of aligned sequences to keep.
      #:   -max_hsps: Set maximum number of HSPs per subject sequence to save for each query.
      search_parameters: {"-task": "blastn", "-perc_identity": 80, "-strand": "minus", "-word_size": 10, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
      #: Hit criteria (either coverage % or minimum alignment length). Hits satisfying these lead to oligo
      #: rejection.
      hit_parameters:
        hit_criterion: "min_alignment_length"
        #: Number of nucleotides for alignment, alternatively, coverage can be used
        value: 17

    #: Remove oligos that may cross-hybridize to other probes (BLAST-based).
    cross_hybridization_blastn_filter:
      enabled: true
      #: BLAST options for the cross-hybridization search.
      #:   -task: Supported tasks.
      #:   -perc_identity: Percent identity cutoff.
      #:   -strand: Query strand(s) to search against database/subject. Choice of both, minus, or plus.
      #:   -word_size: Length of initial exact match.
      #:   -dust: Filter query sequence with dust.
      #:   -soft_masking: Apply filtering locations as soft masks (i.e., only for finding initial matches).
      #:   -max_target_seqs: Maximum number of aligned sequences to keep.
      search_parameters: {"-task": "blastn", "-perc_identity": 80, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
      #: Hit criteria. Hits satisfying these lead to oligo rejection.
      hit_parameters:
        hit_criterion: "min_alignment_length"
        #: Number of nucleotides for alignment, alternatively, coverage can be used
        value: 17

  #: Parameters for selecting multiple probe sets per gene (size, spacing, scoring, diversification).
  probe_set_selection:
    independent_set_selection:
      #: Number of probe sets to generate per gene.
      n_sets: 1
      #: Minimum set size. Genes that cannot form a set of at least this size are reported as insufficient.
      set_size_min: 50
      #: Preferred (optimal) number of oligos per set.
      set_size_opt: 50
      #: Required spacing: negative = allow overlap (bases), 0 = adjacent OK, positive = minimum gap (bases).
      distance_between_probes: 0
      #: Number of randomized graph attempts used to diversify set selection.
      n_attempts_graph: 50
      #: Maximum cliques enumerated per graph attempt.
      n_attempts_clique_enum: 50
      #: Fraction of oligos removed from the graph in each attempt to increase set diversity.
      diversification_fraction: 0.1
      #: Target maximum Jaccard similarity between selected sets; lower = more distinct sets.
      jaccard_opt: 0.5
      #: Step size for relaxing Jaccard threshold when too few sets are found.
      jaccard_step: 0.1
    GC_content_score:
      #: Weight for GC content in the set-selection scoring function.
      weight: 1
      #: Target (optimal) GC content (%) for scoring.
      GC_content_opt: 55
    Tm_score:
      #: Weight for Tm in the set-selection scoring function.
      weight: 1
      #: Target (optimal) Tm (°C) for scoring.
      Tm_opt: 72
    isoform_consensus_score:
      #: Weight for isoform coverage in the set-selection scoring function.
      weight: 2

  #: Parameters for melting temperature computation that are reused for different filtering and scoring
  #: methods.
  Tm_parameters:
    Tm_NN_parameters:
      #: Thermodynamic NN values.
      nn_table: "DNA_NN4"
      #: Thermodynamic values for terminal mismatches.
      tmm_table: "DNA_TMM1"
      #: Thermodynamic values for internal mismatches, may include insosine mismatches.
      imm_table: "DNA_IMM1"
      #: Thermodynamic values for dangling ends.
      de_table: "DNA_DE1"
      #: Concentration of the higher concentrated strand [nM].
      dnac1: 5
      #: Concentration of the lower concentrated strand [nM].
      dnac2: 0
      #: Salt correction method, see Bio.SeqUtils.MeltingTemp.salt_correction.
      saltcorr: 5
      #: Concentration of the ions [mM].
      Na: 300
      #: Concentration of the ions [mM].
      K: 0
      #: Concentration of the ions [mM].
      Tris: 0
      #: Concentration of the ions [mM].
      Mg: 0
      #: Concentration of the ions [mM].
      dNTPs: 0
    Tm_chem_correction_parameters:
      #: Should chem correction be used in the calculation of the melting temperature?
      enabled: false
    Tm_salt_correction_parameters:
      #: Should salt correction be used in the calculation of the melting temperature?
      enabled: false

##### READOUT PROBES PARAMETERS #####
# All following parameters are default parameters taken from TBD

readout_probes:
  #: Parameters that determine the codebook generation or loading.
  codebook:
    source: "generate"
    #: Only used when source = load. Path to the codebook file (csv/tsv): columns = 'bits', rows =
    #: 'gene_name'; entries are 0/1 bit-encodings for each gene.
    file: null
    #: Number of bits in each barcode.
    n_bits: 16
    #: Minimum Hamming distance between any two valid barcodes (MHD4 = 4 for single-bit error correction).
    min_hamming_dist: 4
    #: Number of bits set to 1 in each barcode (MERFISH standard = 2). Equals readout overhangs per encoding
    #: probe (first half 5' of target, second half 3').
    hamming_weight: 2

  #: Parameters that determine the readout probe table generation or loading.
  readout_probe_table:
    source: "generate"
    #: Path to the bit-indexed readout probe table (csv/tsv) with columns 'channel', 'readout_probe_id',
    #: 'readout_probe_sequence'.
    file: null
    #: Fluorescence channels used for round-robin channel assignment across bits.
    channels_ids: ["Alexa488", "Cy3b", "Alexa647"]

    oligo_generation:
      #: Length (bases) of each random readout probe.
      probe_length: 20
      #: Per-base probability used to generate random readout-probe sequences.
      #:   A: Probability of base 'A' when generating random sequences.
      #:   C: Probability of base 'C' when generating random sequences.
      #:   G: Probability of base 'G' when generating random sequences.
      #:   T: Probability of base 'T' when generating random sequences.
      base_probabilities: {"A": 0.25, "C": 0.00, "G": 0.50, "T": 0.25}
      #: Number of random sequences to generate before filtering.
      initial_num_sequences: 100000

    #: Parameters for filters that depend on properties of the filters (e.g., melting temperature).
    property_filters:
      #: Exclude oligos containing long homopolymeric runs (e.g. AAAAA).
      homopolymeric_runs_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Minimum run length per base to count as homopolymeric (any base not listed is unrestricted). Oligos
        #: with longer runs are rejected.
        #:   G: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
        homopolymeric_base_n: {"G": 3}

      #: Enforce GC content within a specified range.
      GC_content_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Minimum GC content (%). Oligos below this are rejected.
        GC_content_min: 40
        #: Maximum GC content (%). Oligos above this are rejected.
        GC_content_max: 50

    #: Parameters for filters that test the specificity of the probes.
    specificity_filters:
      #: Remove readout probes with significant hits to the reference (BLAST-based).
      specificity_blastn_filter:
        enabled: true
        #: BLAST options for the specificity search.
        #:   -task: Supported tasks.
        #:   -perc_identity: Percent identity cutoff.
        #:   -strand: Query strand(s) to search against database/subject. Choice of both, minus, or plus.
        #:   -word_size: Length of initial exact match.
        #:   -dust: Filter query sequence with dust.
        #:   -soft_masking: Apply filtering locations as soft masks (i.e., only for finding initial matches).
        #:   -max_target_seqs: Maximum number of aligned sequences to keep.
        #:   -max_hsps: Set maximum number of HSPs per subject sequence to save for each query.
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        #: Hit criteria (either coverage % or minimum alignment length). Hits satisfying these lead to oligo
        #: rejection.
        hit_parameters:
          hit_criterion: "min_alignment_length"
          #: Number of nucleotides for alignment, alternatively, coverage can be used
          value: 11

      #: Remove oligos that may cross-hybridize to other probes (BLAST-based).
      cross_hybridization_blastn_filter:
        enabled: true
        #: BLAST options for the cross-hybridization search.
        #:   -task: Supported tasks.
        #:   -perc_identity: Percent identity cutoff.
        #:   -strand: Query strand(s) to search against database/subject. Choice of both, minus, or plus.
        #:   -word_size: Length of initial exact match.
        #:   -dust: Filter query sequence with dust.
        #:   -soft_masking: Apply filtering locations as soft masks (i.e., only for finding initial matches).
        #:   -max_target_seqs: Maximum number of aligned sequences to keep.
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10}
        #: Hit criteria. Hits satisfying these lead to oligo rejection.
        hit_parameters:
          hit_criterion: "min_alignment_length"
          #: Number of nucleotides for alignment, alternatively, coverage can be used
          value: 11

    #: Parameters for selecting multiple probe sets per gene (size, spacing, scoring, diversification).
    probe_set_selection:
      #: Total number of readout probes to select (must equal n_bits so each bit gets a probe).
      set_size: 16
      #: Number of candidate sets to evaluate; higher values may find better sets but increase computation
      #: time.
      n_combinations: 100000
      #: Weights for property homogeneity in the score minimised across the set (weighted sum of variances).
      homogeneous_properties_weights: {TmNN_oligo: 1.0, GC_content_oligo: 1.0}

    #: Parameters for melting temperature computation that are reused for different filtering and scoring
    #: methods.
    Tm_parameters:
      Tm_NN_parameters:
        #: Thermodynamic NN values.
        nn_table: "DNA_NN4"
        #: Thermodynamic values for terminal mismatches.
        tmm_table: "DNA_TMM1"
        #: Thermodynamic values for internal mismatches, may include insosine mismatches.
        imm_table: "DNA_IMM1"
        #: Thermodynamic values for dangling ends.
        de_table: "DNA_DE1"
        #: Concentration of the higher concentrated strand [nM].
        dnac1: 25
        #: Concentration of the lower concentrated strand [nM].
        dnac2: 25
        #: Salt correction method, see Bio.SeqUtils.MeltingTemp.salt_correction.
        saltcorr: 5
        #: Concentration of the ions [mM].
        Na: 300
        #: Concentration of the ions [mM].
        K: 0
        #: Concentration of the ions [mM].
        Tris: 0
        #: Concentration of the ions [mM].
        Mg: 0
        #: Concentration of the ions [mM].
        dNTPs: 0
      Tm_chem_correction_parameters:
        #: Should chem correction be used in the calculation of the melting temperature?
        enabled: false
      Tm_salt_correction_parameters:
        #: Should salt correction be used in the calculation of the melting temperature?
        enabled: false

##### PRIMERS PARAMETERS #####
# All following parameters are default parameters taken from TBD

primers:
  #: Parameters that determine the forward primer generation or loading.
  forward_primer:
    source: "generate"
    #: Only used when source = load.
    sequence: null

    oligo_generation:
      #: Length (bases) of each generated primer.
      probe_length: 20
      #: Per-base probability used to generate random primer sequences.
      #:   A: Probability of base 'A' when generating random sequences.
      #:   C: Probability of base 'C' when generating random sequences.
      #:   G: Probability of base 'G' when generating random sequences.
      #:   T: Probability of base 'T' when generating random sequences.
      base_probabilities: {"A": 0.25, "C": 0.25, "G": 0.25, "T": 0.25}
      #: Number of random sequences to generate before filtering.
      initial_num_sequences: 1000000

    #: Parameters for filters that depend on properties of the filters (e.g., melting temperature).
    property_filters:
      #: Exclude oligos containing long homopolymeric runs (e.g. AAAAA).
      homopolymeric_runs_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Minimum run length per base to count as homopolymeric (any base not listed is unrestricted). Oligos
        #: with longer runs are rejected.
        #:   A: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
        #:   T: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
        #:   C: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
        #:   G: Minimum run length per base to count as homopolymeric. Oligos with longer runs are rejected.
        homopolymeric_base_n: {"A": 4, "T": 4, "C": 4, "G": 4}

      #: Enforce GC content within a specified range.
      GC_content_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Minimum GC content (%). Oligos below this are rejected.
        GC_content_min: 50
        #: Maximum GC content (%). Oligos above this are rejected.
        GC_content_max: 65

      #: Require G/C nucleotides at the 3' end of the primer for stable binding.
      GC_clamp_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Minimum number of G or C nucleotides required at the 3' end.
        number_GC_GCclamp: 1
        #: Number of bases from the 3' end to consider for the GC clamp.
        number_three_prime_base_GCclamp: 2

      #: Limit self-complementarity to avoid hairpins.
      self_complementarity_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Maximum allowable length of self-complementary sequences. Probes with longer self-complementary
        #: regions can form hairpins.
        max_len_selfcomplement: 6

      #: Limit complementarity between the forward primer and the (known) reverse primer to prevent
      #: primer-dimer formation.
      complement_reverse_primer_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Maximum allowable length of complementarity between the forward primer and the (known) reverse
        #: primer, to prevent primer-dimer formation.
        max_len_complement: 5

      #: Enforce melting temperature (Tm) within a range (additionally uses Tm parameters).
      Tm_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Minimum melting temperature (°C). Oligos below this are rejected.
        Tm_min: 60
        #: Maximum melting temperature (°C). Oligos above this are rejected.
        Tm_max: 75

      #: Reject oligos with stable secondary structure at the given temperature.
      secondary_structure_filter:
        #: Turn this filter on or off.
        enabled: true
        #: Temperature (°C) at which secondary structure free energy is evaluated.
        T: 76
        #: Free-energy threshold (kcal/mol). Oligos with ΔG ≤ thr_DG (stable structure) are rejected.
        thr_DG: 0

    #: Parameters for filters that test the specificity of the probes.
    specificity_filters:
      #: Ensure primer specificity against a reference database (BLAST-based).
      specificity_blastn_filter:
        enabled: true
        #: BLAST options for the specificity search.
        #:   -task: Supported tasks.
        #:   -perc_identity: Percent identity cutoff.
        #:   -strand: Query strand(s) to search against database/subject. Choice of both, minus, or plus.
        #:   -word_size: Length of initial exact match.
        #:   -dust: Filter query sequence with dust.
        #:   -soft_masking: Apply filtering locations as soft masks (i.e., only for finding initial matches).
        #:   -max_target_seqs: Maximum number of aligned sequences to keep.
        #:   -max_hsps: Set maximum number of HSPs per subject sequence to save for each query.
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        #: Hit criteria (either coverage % or minimum alignment length). Hits satisfying these lead to oligo
        #: rejection.
        hit_parameters:
          hit_criterion: "min_alignment_length"
          #: Number of nucleotides for alignment, alternatively, coverage can be used
          value: 14

      #: Remove primers that match the assembled hybridization probes (BLAST-based).
      hybridization_probes_blastn_filter:
        enabled: true
        #: BLASTN search parameters for filtering primers that match the assembled hybridization probes.
        #:   -task: Supported tasks.
        #:   -perc_identity: Percent identity cutoff.
        #:   -strand: Query strand(s) to search against database/subject. Choice of both, minus, or plus.
        #:   -word_size: Length of initial exact match.
        #:   -dust: Filter query sequence with dust.
        #:   -soft_masking: Apply filtering locations as soft masks (i.e., only for finding initial matches).
        #:   -max_target_seqs: Maximum number of aligned sequences to keep.
        #:   -max_hsps: Set maximum number of HSPs per subject sequence to save for each query.
        search_parameters: {"-task": "blastn", "-perc_identity": 100, "-strand": "minus", "-word_size": 7, "-dust": "no", "-soft_masking": "false", "-max_target_seqs": 10, "-max_hsps": 1000}
        #: Parameters for filtering BLASTN hits against the hybridization probes. Use either coverage or
        #: min_alignment_length.
        hit_parameters:
          hit_criterion: "min_alignment_length"
          #: Number of nucleotides for alignment, alternatively, coverage can be used
          value: 11

    #: Parameters for melting temperature computation that are reused for different filtering and scoring
    #: methods.
    Tm_parameters:
      Tm_NN_parameters:
        #: Thermodynamic NN values.
        nn_table: "DNA_NN4"
        #: Thermodynamic values for terminal mismatches.
        tmm_table: "DNA_TMM1"
        #: Thermodynamic values for internal mismatches, may include insosine mismatches.
        imm_table: "DNA_IMM1"
        #: Thermodynamic values for dangling ends.
        de_table: "DNA_DE1"
        #: Concentration of the higher concentrated strand [nM].
        dnac1: 250
        #: Concentration of the lower concentrated strand [nM].
        dnac2: 250
        #: Salt correction method, see Bio.SeqUtils.MeltingTemp.salt_correction.
        saltcorr: 5
        #: Concentration of the ions [mM].
        Na: 300
        #: Concentration of the ions [mM].
        K: 0
        #: Concentration of the ions [mM].
        Tris: 0
        #: Concentration of the ions [mM].
        Mg: 0
        #: Concentration of the ions [mM].
        dNTPs: 0
      Tm_chem_correction_parameters:
        #: Should chem correction be used in the calculation of the melting temperature?
        enabled: false
      Tm_salt_correction_parameters:
        #: Should salt correction be used in the calculation of the melting temperature?
        enabled: false

  #: Parameters that determine the reverse primer generation or loading.
  reverse_primer:
    source: "load"
    #: The default is the reverse complement of 20 nt T7 promoter sequence. Only used when source = load.
    sequence: "CCCTATAGTGAGTCGTATTA"

############################
### EXECUTION PARAMETERS ###
############################

#: Config file format version, do not edit
schema_version: 2

metadata:
  #: Name of the protocol for which oligos are designed.
  protocol: "MERFISH"
  #: Link to the paper from which the default parameters are taken.
  source_default_parameters: https://example.com/
  #: Name of the source of the default parameters, e.g. the first author of the paper.
  name_default_parameters: "TBD"

general:
  #: number of cores used to run the pipeline and 2*n_jobs +1 of regions that should be stored in cache. If
  #: memory consumption of pipeline is too high reduce this number, if a lot of RAM is available increase this
  #: number to decrease runtime
  n_jobs: 4
  #: name of the directory where the output files will be written
  dir_output: "output_merfish_probe_designer"
  #: if true, writes the oligo sequences after each step of the pipeline into a csv file
  write_intermediate_steps: true
