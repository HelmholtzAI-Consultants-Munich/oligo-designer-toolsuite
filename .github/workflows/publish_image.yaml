name: Create and publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      odt_ref:
        description: "Git ref of oligo-designer-toolsuite to install in the image (tag, branch or commit SHA). Also used as the image tag."
        required: true
        default: main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/odt
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.odt_ref }},enable=${{ github.event_name == 'workflow_dispatch' }}
          # only add the `latest` tag when a new tag triggers this workflow
          flavor: |
            latest=${{ github.event_name == 'push' }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push server Docker image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ODT_REF=${{ inputs.odt_ref || github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
