name: MacOS Arm64

on:
  schedule:
    - cron: "0 0 1 * *"

  push:
    branches: [main, dev]
    paths-ignore: ['.gitignore', '.pre-commit-config.yaml', '.readthedocs.yaml', 'CONTRIBUTION.md', 'LICENSE', 'MANIFEST.in', 'README.md', 'data/**', 'docs/**', 'tutorials/**']

  pull_request:
    branches: [main, dev]
    paths-ignore: ['.gitignore', '.pre-commit-config.yaml', '.readthedocs.yaml', 'CONTRIBUTION.md', 'LICENSE', 'MANIFEST.in', 'README.md', 'data/**', 'docs/**', 'tutorials/**']

  workflow_dispatch:
  workflow_call:

jobs:
  matrix:
    name: Build python-version matrix from pyproject.toml
    runs-on: ubuntu-latest

    outputs:
      python-versions: ${{ steps.set-matrix.outputs.python-versions }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python (for parsing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: set-matrix
        name: Parse requires-python and emit versions
        shell: bash
        run: |
          echo "python-versions=$(python .github/scripts/ci_python_versions.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 6

      matrix:
        os: [macos-14]
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          # installer-url: https://github.com/conda-forge/miniforge/releases/download/23.11.0-0/Mambaforge-23.11.0-0-MacOSX-arm64.sh
          miniforge-version: latest
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: "test-env"
          channels: conda-forge, bioconda
          channel-priority: strict
          use-mamba: true

      - name: Verify ARM64 runner
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: Install system dependencies
        run: |
          conda activate test-env

          # conda config --add channels bioconda
          # conda config --add channels conda-forge
          # conda update --all

          mamba install -y \
            "blast>=2.15.0" \
            "bedtools>=2.30" \
            "bowtie>=1.3.1" \
            "bowtie2>=2.5" \
            "samtools>=1.22" \
            "bcftools>=1.22"

      - name: Install package
        run: |
          conda activate test-env

          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Reduce n_jobs for CI
        run: |
          sed -i '' 's/n_jobs: 4/n_jobs: 1/g' data/configs/*.yaml

      - name: Run tests
        run: |
          conda activate test-env

          pytest --disable-warnings -k "not FTPLoader"
