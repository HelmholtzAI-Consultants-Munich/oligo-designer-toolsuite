name: Ubuntu x64

on:
  schedule:
    - cron: "0 0 1 * *"

  push:
    branches: [main, dev]
    paths-ignore: ['.gitignore', '.pre-commit-config.yaml', '.readthedocs.yaml', 'CONTRIBUTION.md', 'LICENSE', 'MANIFEST.in', 'README.md', 'data/**', 'docs/**', 'tutorials/**']

  pull_request:
    branches: [main, dev]
    paths-ignore: ['.gitignore', '.pre-commit-config.yaml', '.readthedocs.yaml', 'CONTRIBUTION.md', 'LICENSE', 'MANIFEST.in', 'README.md', 'data/**', 'docs/**', 'tutorials/**']

  workflow_dispatch:
  workflow_call:

jobs:
  matrix:
    name: Build python-version matrix from pyproject.toml
    runs-on: ubuntu-latest

    outputs:
      python-versions: ${{ steps.set-matrix.outputs.python-versions }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python (for parsing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: set-matrix
        name: Parse requires-python and emit versions
        shell: bash
        run: |
          echo "python-versions=$(python .github/scripts/ci_python_versions.py)" >> "$GITHUB_OUTPUT"

  build:
    name: Ubuntu x Python ${{ matrix.python-version }}

    needs: matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 12

      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: test-env
          channels: conda-forge, bioconda
          channel-priority: strict
          use-mamba: true

      - name: Install system dependencies
        run: |
          conda activate test-env

          # conda config --add channels bioconda
          # conda config --add channels conda-forge
          # conda update --all

          mamba install -y \
            "blast>=2.15.0" \
            "bedtools>=2.30" \
            "bowtie>=1.3.1" \
            "bowtie2>=2.5" \
            "samtools>=1.22" \
            "bcftools>=1.22"

      - name: Clone environment for ai-filters tests
        run: |
          # Clone the env for later tests with optional ai-filters installed
          conda create -y --clone test-env --name test-env-aifilters

      - name: Install Python package
        run: |
          conda activate test-env

          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify installation
        run: |
          conda activate test-env

          # Default install: package (and the filter class) must import without ai-filters / torch.
          python -c "import oligo_designer_toolsuite; from oligo_designer_toolsuite.oligo_specificity_filter import HybridizationProbabilityFilter"
          # torch must NOT be pulled in by the default install.
          if pip show torch > /dev/null 2>&1; then
            echo "ERROR: torch is installed but should not be without the ai-filters extra"; exit 1
          fi

      - name: Run tests
        env:
          PLATFORM: ${{ matrix.os }}
        run: |
          conda activate test-env

          # AI filter tests skip here (ai-filters not installed); everything else runs.
          pytest --disable-warnings -k "not FTPLoader"

      - name: Install Python package with ai-filters (cloned env)
        run: |
          conda activate test-env-aifilters

          python -m pip install --upgrade pip
          pip install -e .[dev,ai-filters]

      - name: Run specificity filter tests with ai-filters (cloned env)
        run: |
          conda activate test-env-aifilters

          # Assert the extra is really installed: this makes HAS_AI_FILTERS True, which
          # is needed for the HybridizationProbability tests
          python -c "from oligo_designer_toolsuite_ai_filters.api import APIBase"
          pytest --disable-warnings tests/test_oligo_specificity_filter.py

# NOTE:
# We currently exclude FTP/network-dependent tests via `-k` name filtering
# because the FTPLoader tests are slower and can be flaky in CI due to
# external server/network variability.
#
# In the future, this should be migrated to proper pytest markers, e.g.:
#
#   @pytest.mark.network
#   @pytest.mark.slow
#
# which would allow cleaner and more scalable CI selection:
#
#   pytest -m "not network"
#
# instead of relying on substring matching via `-k`.
#
# Marker-based test selection is the recommended pytest approach for
# categorizing slow, integration, or network-dependent tests and scales
# much better as the test suite grows. :contentReference[oaicite:0]{index=0}
